name: Tekto check

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Build Tekto CLI
        run: npm ci && npm run build
        working-directory: tekto
      - name: tekto check
        run: node tekto/dist/cli.js check