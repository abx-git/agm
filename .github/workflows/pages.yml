name: Deploy Tekto Studio (GitHub Pages)

# Publishes docs/studio/dist to https://github.com/abx-git/agm.github.io
# Live URL: https://abx-git.github.io/agm.github.io/  (tekto.github.io when migrated)

on:
  push:
    branches: [main]
    paths:
      - 'docs/studio/**'
      - 'docs/quickstart.md'
      - 'docs/positioning.md'
      - 'docs/guide.md'
      - 'docs/ROADMAP.md'
      - 'docs/reference/**'
      - 'docs/tekto/**'
      - 'docs/pages/**'
      - 'README.md'
      - 'MIGRATION.md'
      - 'scripts/build-tekto-pages.mjs'
      - 'scripts/push-studio-to-pages.sh'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

concurrency:
  group: deploy-tekto-studio-github-io
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Prepare deploy key + SSH preflight
        env:
          ACTIONS_DEPLOY_KEY: ${{ secrets.ACTIONS_DEPLOY_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${ACTIONS_DEPLOY_KEY:-}" ]; then
            echo "::error::Missing secret ACTIONS_DEPLOY_KEY on the source repo. See docs/studio/GITHUB-PAGES-SETUP.md"
            exit 1
          fi

          python3 <<'PY'
          import os
          from pathlib import Path

          raw = os.environ["ACTIONS_DEPLOY_KEY"].strip()
          if "BEGIN" in raw and raw.count("\n") < 3 and "\\n" in raw:
              raw = raw.replace("\\n", "\n")
          raw = raw.replace("\r\n", "\n").replace("\r", "\n").strip() + "\n"
          if "BEGIN" not in raw or "PRIVATE KEY" not in raw:
              raise SystemExit(
                  "::error::ACTIONS_DEPLOY_KEY does not look like a private key "
                  "(expected -----BEGIN … PRIVATE KEY-----)."
              )
          path = Path(os.environ["RUNNER_TEMP"]) / "tekto_pages_deploy_key"
          path.write_text(raw)
          path.chmod(0o600)
          print(f"Wrote deploy key ({path.stat().st_size} bytes)")
          PY

          KEY="${RUNNER_TEMP}/tekto_pages_deploy_key"
          echo "DEPLOY_KEY_PATH=$KEY" >> "$GITHUB_ENV"

          echo "Public key derived from secret (must match Deploy Key on agm.github.io):"
          ssh-keygen -y -f "$KEY" | tee "${RUNNER_TEMP}/tekto_pages_deploy_key.pub"
          ssh-keygen -lf "${RUNNER_TEMP}/tekto_pages_deploy_key.pub"

          eval "$(ssh-agent -s)"
          ssh-add "$KEY"
          mkdir -p ~/.ssh
          ssh-keyscan -t rsa,ed25519 github.com >> ~/.ssh/known_hosts 2>/dev/null

          set +e
          SSH_OUT=$(ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -T git@github.com 2>&1)
          set -e
          echo "$SSH_OUT"
          if ! echo "$SSH_OUT" | grep -qi "successfully authenticated"; then
            echo "::error::SSH to github.com failed (publickey)."
            exit 1
          fi

          git ls-remote git@github.com:abx-git/agm.github.io.git HEAD
          echo "SSH preflight OK."

      - name: Ensure GitHub Pages is enabled on agm.github.io
        env:
          AGM_GHIO_DEPLOY: ${{ secrets.AGM_GHIO_DEPLOY }}
          TEKTO_GHIO_DEPLOY: ${{ secrets.TEKTO_GHIO_DEPLOY }}
          BLUEPRINT_PATTERN_GHIO_DEPLOY: ${{ secrets.BLUEPRINT_PATTERN_GHIO_DEPLOY }}
        run: |
          set -euo pipefail
          TOKEN="${TEKTO_GHIO_DEPLOY:-${AGM_GHIO_DEPLOY:-${BLUEPRINT_PATTERN_GHIO_DEPLOY:-}}}"
          if [ -z "$TOKEN" ]; then
            echo "::notice::No TEKTO_GHIO_DEPLOY / AGM_GHIO_DEPLOY — skipping Pages API. Ensure Pages is on (main / /)."
            exit 0
          fi
          echo "::add-mask::$TOKEN"
          API="https://api.github.com/repos/abx-git/agm.github.io/pages"
          STATUS=$(curl -s -o /tmp/pages.json -w "%{http_code}" \
            -H "Authorization: Bearer $TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "$API")
          if [ "$STATUS" = "200" ]; then
            echo "GitHub Pages already enabled."
            exit 0
          fi
          if [ "$STATUS" = "401" ] || [ "$STATUS" = "403" ]; then
            echo "::warning::Pages API auth failed (HTTP $STATUS). Enable Pages manually if needed."
            exit 0
          fi
          if [ "$STATUS" != "404" ]; then
            echo "::error::Unexpected Pages API status $STATUS"
            cat /tmp/pages.json
            exit 1
          fi
          curl -fsSL -X POST \
            -H "Authorization: Bearer $TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "$API" \
            -d '{"build_type":"legacy","source":{"branch":"main","path":"/"}}'
          echo "GitHub Pages enabled."

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: docs/studio/package-lock.json

      - name: Build Tekto site (Studio + docs)
        run: |
          set -euo pipefail
          cd docs/studio
          npm ci
          npm run build:pages

      - name: Deploy docs/studio/dist to agm.github.io
        run: |
          set -euo pipefail
          KEY="${DEPLOY_KEY_PATH}"
          eval "$(ssh-agent -s)"
          ssh-add "$KEY"
          export GIT_SSH_COMMAND="ssh -i $KEY -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes"

          SITE="${RUNNER_TEMP}/agm.github.io"
          rm -rf "$SITE"
          git clone --depth 1 git@github.com:abx-git/agm.github.io.git "$SITE"

          find "$SITE" -mindepth 1 -maxdepth 1 ! -name '.git' -exec rm -rf {} +
          rsync -a docs/studio/dist/ "$SITE/"

          touch "$SITE/.nojekyll"

          mkdir -p "$SITE/legacy-assistant"
          cat > "$SITE/legacy-assistant/index.html" <<'HTML'
          <!DOCTYPE html>
          <html lang="en">
          <head>
            <meta charset="utf-8" />
            <meta http-equiv="refresh" content="0;url=../" />
            <title>Moved to Tekto Studio</title>
          </head>
          <body>
            <p>Legacy assistant URL — use <a href="../">Tekto Studio</a> (Docs · Review · Composer · Ask AI).</p>
          </body>
          </html>
          HTML

          cd "$SITE"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No content changes — nothing to push."
          else
            git commit -m "Deploy Tekto Studio from tekto@${GITHUB_SHA:0:7}"
            git push origin main
            echo "Pushed to abx-git/agm.github.io main."
          fi

          echo "Live URL: https://abx-git.github.io/agm.github.io/"

          SITE_SHA="$(git -C "$SITE" rev-parse HEAD)"
          DEPLOY_OK=0
          for i in $(seq 1 36); do
            sleep 10
            DEP_JSON=$(curl -sS -H "Accept: application/vnd.github+json" -H "User-Agent: tekto-pages-ci" \
              "https://api.github.com/repos/abx-git/agm.github.io/deployments?sha=${SITE_SHA}&environment=github-pages&per_page=1" || true)
            DEP_ID=$(python3 -c 'import json,sys; d=json.loads(sys.argv[1]); print(d[0]["id"] if isinstance(d,list) and d else "")' "$DEP_JSON" 2>/dev/null || true)
            if [ -z "$DEP_ID" ]; then
              echo "  [$i] no deployment yet for $SITE_SHA"
              continue
            fi
            ST_JSON=$(curl -sS -H "Accept: application/vnd.github+json" -H "User-Agent: tekto-pages-ci" \
              "https://api.github.com/repos/abx-git/agm.github.io/deployments/${DEP_ID}/statuses?per_page=5" || true)
            STATE=$(python3 -c 'import json,sys; d=json.loads(sys.argv[1]); print(d[0]["state"] if isinstance(d,list) and d else "")' "$ST_JSON" 2>/dev/null || true)
            echo "  [$i] deployment $DEP_ID state=$STATE"
            if [ "$STATE" = "success" ]; then
              DEPLOY_OK=1
              break
            fi
            if [ "$STATE" = "failure" ] || [ "$STATE" = "error" ]; then
              echo "::error::pages-build-deployment failed on agm.github.io (state=$STATE)."
              exit 1
            fi
          done
          if [ "$DEPLOY_OK" != "1" ]; then
            echo "::error::Timed out waiting for github-pages deploy of ${SITE_SHA}."
            exit 1
          fi

          for URL in \
            "https://abx-git.github.io/agm.github.io/" \
            "https://abx-git.github.io/agm.github.io/docs/" \
            "https://abx-git.github.io/agm.github.io/docs/quickstart.html"
          do
            CODE=$(curl -s -o /dev/null -w "%{http_code}" "$URL" || true)
            echo "$URL → HTTP $CODE"
            if [ "$CODE" != "200" ]; then
              echo "::error::Expected HTTP 200 for $URL"
              exit 1
            fi
          done
          echo "Live site OK (Studio + docs)."